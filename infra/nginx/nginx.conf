worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Benchmark conditions: measure raw framework output, no compression,
    # no access logging.
    access_log off;
    gzip off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    keepalive_requests 10000;

    fastcgi_buffer_size 8k;
    fastcgi_buffers 64 8k;

    ############################################################################
    # Persistent FastCGI connections to PHP-FPM (keepalive pool). Without this
    # nginx opens a new TCP connection per request and Nagle/delayed-ACK adds
    # ~20ms latency per request, hiding the actual framework cost.
    ############################################################################

    upstream plain_upstream {
        server plain:9000;
        keepalive 32;
    }
    upstream kotchasan_upstream {
        server kotchasan:9000;
        keepalive 32;
    }
    upstream slim_upstream {
        server slim:9000;
        keepalive 32;
    }
    upstream codeigniter_upstream {
        server codeigniter:9000;
        keepalive 32;
    }
    upstream symfony_upstream {
        server symfony:9000;
        keepalive 32;
    }
    upstream laravel_upstream {
        server laravel:9000;
        keepalive 32;
    }

    ############################################################################
    # One server block per framework under test. Blocks are identical except
    # for the listen port, document root and fastcgi upstream, so nginx is a
    # controlled variable.
    ############################################################################

    server {
        listen 8081;
        root /app/public;
        location / {
            include fastcgi_params;
            fastcgi_pass plain_upstream;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        }
    }

    server {
        listen 8082;
        # Kotchasan apps live at the docroot (same layout as GCMS)
        root /app;
        location / {
            include fastcgi_params;
            fastcgi_pass kotchasan_upstream;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        }
    }

    server {
        listen 8083;
        root /app/public;
        location / {
            include fastcgi_params;
            fastcgi_pass slim_upstream;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        }
    }

    server {
        listen 8084;
        root /app/public;
        location / {
            include fastcgi_params;
            fastcgi_pass codeigniter_upstream;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        }
    }

    server {
        listen 8085;
        root /app/public;
        location / {
            include fastcgi_params;
            fastcgi_pass symfony_upstream;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        }
    }

    server {
        listen 8086;
        root /app/public;
        location / {
            include fastcgi_params;
            fastcgi_pass laravel_upstream;
            fastcgi_keep_conn on;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        }
    }
}
