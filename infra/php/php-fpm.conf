; Benchmark FPM pool — identical for every framework under test.
[www]
; Static pool so worker count is a controlled variable (12 host cores).
pm = static
pm.max_children = 16
; Never recycle workers during the benchmark: with pm.max_requests > 0 the
; periodic worker restart would re-pay each framework's cold bootstrap cost
; at a rate tied to its own throughput, adding framework-dependent noise.
pm.max_requests = 0
; Keep container env (DB DSN etc.) visible to workers via getenv().
clear_env = no
catch_workers_output = no
decorate_workers_output = no
