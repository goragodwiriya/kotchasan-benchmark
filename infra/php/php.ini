; Benchmark PHP configuration — identical for every framework under test.
; Production-like settings: opcache on, no stat calls, no JIT (documented choice).

memory_limit=256M
expose_php=Off
date.timezone=UTC
display_errors=Off
display_startup_errors=Off
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT
log_errors=On
error_log=/proc/self/fd/2

opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.revalidate_freq=60
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; JIT disabled: most shared-hosting / typical production deployments do not
; enable JIT, and tracing JIT adds warmup variance to short benchmark runs.
opcache.jit=disable
opcache.jit_buffer_size=0

realpath_cache_size=4096K
realpath_cache_ttl=600
